[MOLBUILDER]
molecules = ['c1ccccc1', 'c1ccsc1', 'C1=CC2C=CC1C=C2', 'C1=CC2(C=C1)C=CC=C2', 'C1=CC(=O)C=CC1=O']
fragments = ['c1c**cc1', 'c1**sc1', '*1*csc1', '*1=*C2C=CC1C=C2', '*1*NC(=O)N1', '*1=*C2(C=C1)C=CC=C2', '*1=*C(=O)C=CC1=O', 'c1c***1', 'c1cc2cccc3c2c(c1)***3', 'c1c****1', '*1**s*1']
mutations_1 = ['[#6R1]-F', '[#6R1&H]', '[#7R1&H0]']
mutations_2 = ['[#8R1r5]', '[#16R1r5]', '[#7R1r5&H]', '[#6R1r5]=O']
protected = ['[cR2]@[cR1r6&H,nR1r6&H0]@[cR2]']
population_size = 100
molsize = [5, 5]
initial_number_mutations = 500
elitism_population_size = 10
mutation_rate = 0.05
recombination_rate = 0.05
tournament_win_rate = 0.75
maximize = False
total_generations = 30
calculation_type = Gaussian
carrier = electron
log_level = INFO
log_format = %(asctime)s - %(levelname)s - %(module)s %(lineno)d - %(message)s

[GAUSSIAN]
g09 = g09
formchk = formchk
memory = 3840MB
cores = 10
method = B3LYP
basis_set = 6-311+G**
electron_affinity_target = 0.0
g09_timeout = 3600
formchk_timeout = 300
